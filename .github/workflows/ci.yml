name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust tests
        env:
          RUST_BACKTRACE: 1
        run: cargo test --all-targets --verbose -- --nocapture

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Build and install editable Python package
        run: python -m pip install -e .

      - name: Run Python tests
        run: python -m pytest tests/ -v

      - name: Test CLI basic commands
        run: |
          tempus --version
          tempus --help

      - name: Smoke test examples
        run: |
          python examples/basic_record.py
          python examples/verify_chain.py
          python examples/full_agent_flow.py

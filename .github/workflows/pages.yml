name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate_site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate static site
        run: node scripts/validate_site.mjs
      - uses: actions/configure-pages@v6
      - name: Assemble Pages artifact
        run: |
          mkdir -p site/assets
          cp assets/logo.png site/assets/logo.png
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tempus_ddb"
version = "0.4.0"
description = "Local-first B2A security gate with tamper-evident execution receipts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tempus DDB Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "mcp>=1.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "maturin",
    "ruff",
    "bandit",
    "pip-audit"
]
keywords = ["ai", "agents", "authorization", "audit", "cryptography", "github", "mcp", "tamper-evident"]

[project.urls]
Homepage = "https://github.com/JPatronC92/tempus-ddb"
Repository = "https://github.com/JPatronC92/tempus-ddb"
Issues = "https://github.com/JPatronC92/tempus-ddb/issues"

[project.scripts]
tempus = "tempus_ddb.cli:main"
tempus-github-executor = "tempus_ddb.github_executor:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "tempus_ddb._tempus_ddb"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

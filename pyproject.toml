[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tempus_ddb"
version = "0.1.0"
description = "Tempus DDB - Tamper-proof Decision Ledger for AI Agents"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "mcp",
    "web3",
    "python-dotenv"
]

[project.scripts]
tempus = "tempus_ddb.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "tempus_ddb._tempus_ddb"

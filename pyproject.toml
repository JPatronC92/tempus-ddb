[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tempus_ddb"
version = "0.2.1"
description = "Free, local-first, tamper-evident decision ledger for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Tempus DDB Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "mcp",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "maturin",
    "ruff",
]
keywords = ["ai", "agents", "ledger", "audit", "cryptography", "mcp", "tamper-evident"]

[project.urls]
Homepage = "https://github.com/JPatronC92/tempus-ddb"
Repository = "https://github.com/JPatronC92/tempus-ddb"
Issues = "https://github.com/JPatronC92/tempus-ddb/issues"

[project.scripts]
tempus = "tempus_ddb.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "tempus_ddb._tempus_ddb"

[tool.pytest.ini_options]
pythonpath = ["python"]
